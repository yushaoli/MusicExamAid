openapi: 3.0.3
info:
  title: Music Exam Aid - API & Service Account H5 Tool
  version: "2.3.0"
  description: OpenAPI specification for the MusicExamAid Fastify API, WeChat Service Account H5 Web Tool, WeCom notifications, ZIP bundle exporter, and Mini Program RPC bridge.
servers:
  - url: https://mea.xgar.com.cn
  - url: http://localhost:3000
paths:
  /official-sync/resolve-session:
    get:
      summary: Resolve the entry role and exchange a current teacher invite for a session
      description: >-
        A current random teacher invite (t_inv_<agent_id>_<32 hex characters>) issues an
        eight-hour HttpOnly, SameSite=Lax mea_teacher_session cookie, Secure in production.
        The signed token is not returned in JSON. Public demo or legacy invites may resolve
        the teacher landing page but return history_access=false and clear the teacher cookie.
        Parent referrals identify an entry channel, grant no historical lookup access, and
        clear the teacher cookie. Invalid invite/ref values also clear it. Resolving wx_openid
        without an invite requires verified family-admin credentials. With no invite/ref,
        the existing family-admin authentication policy applies. Responses are not cacheable.
      parameters:
        - in: query
          name: invite_token
          schema: { type: string }
        - in: query
          name: ref
          schema: { type: string }
        - in: query
          name: wx_openid
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [parent, admin] }
      responses:
        "200":
          description: Resolved role and entry channel; teacher responses include history_access
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Set-Cookie:
              description: Issues or clears mea_teacher_session when an invite/ref is resolved
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [role, is_isolated, locked_agent]
                properties:
                  role: { type: string, enum: [teacher, parent, admin] }
                  is_isolated: { type: boolean }
                  history_access:
                    type: boolean
                    description: Whether this teacher invite can issue historical lookup credentials
                  locked_agent: { type: object, nullable: true }
        "401":
          description: Invalid invite/ref or missing family-admin credentials
  /official-sync/student-lookup:
    get:
      summary: Search historical student profiles and exam records within the verified session scope
      description: >-
        Always requires verified credentials, including when ENFORCE_SERVER_AUTH=0 in development.
        Family admins can browse all profiles and full exam histories. Teachers can browse only
        profiles currently assigned to their signed agent ID and exams recorded under that agent ID.
        Counts, latest exams and recommendations use the same restricted history. Every teacher
        request rechecks the current invite digest; invite rotation/removal revokes the session.
        Parent referrals and client-supplied identities do not grant access. Responses use
        Cache-Control=no-store. Admin agent_id filters current profiles while retaining full history.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - teacherSessionHeader: []
        - teacherSessionCookie: []
        - signedSessionBearer: []
      parameters:
        - in: query
          name: q
          description: Name, pinyin, masked phone or masked ID search; empty lists authorized profiles
          schema: { type: string, maxLength: 200, default: "" }
        - in: query
          name: agent_id
          description: Optional admin filter; teachers may specify only their own agent ID
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: limit
          description: Positive safe integer; values above 50 are capped at 50
          schema: { type: integer, minimum: 1, maximum: 9007199254740991, default: 12 }
      responses:
        "200":
          description: Authorized profiles with scoped exam histories and upgrade recommendations
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { type: object }
        "400":
          description: Invalid query, agent ID or limit
        "401":
          description: Missing, expired, invalid or revoked session
        "403":
          description: A teacher requested a different agent ID
  /app:
    get:
      summary: WeChat Service Account & WeCom H5 Web Tool (?tab=parent|archive|console)
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [parent, archive, console]
      responses:
        "200":
          description: HTML application
  /health:
    get:
      summary: Service health and dependency status check (?live=1 for live TCP probe)
      parameters:
        - in: query
          name: live
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Service health status
  /learners:
    get:
      summary: List learner profiles with masked IDs (id_last4)
      responses:
        "200":
          description: Learner list
    post:
      summary: Create learner profile with AES-256-GCM encrypted ID at rest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_cn, gender, dob, id_type, id_number, guardian_phone]
              properties:
                name_cn: { type: string }
                gender: { type: string, enum: [男, 女] }
                dob: { type: string, format: date }
                id_type: { type: string }
                id_number: { type: string }
                guardian_phone: { type: string }
      responses:
        "201":
          description: Learner created (returns id_last4 only)
  /learners/{id}:
    get:
      summary: Get learner profile (masked ID)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Learner profile
  /learners/{id}/photo:
    post:
      summary: Upload or replace learner portrait photo (base64 JPEG/PNG) for ZIP bundle export
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_base64]
              properties:
                photo_base64: { type: string }
      responses:
        "200":
          description: Portrait photo stored
  /registrations:
    get:
      summary: List registrations with resolved Chinese subject names
      responses:
        "200":
          description: Registration list
    post:
      summary: Create draft registration record for an exam cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learner_id, cycle_id, subject_id, level]
              properties:
                learner_id: { type: string }
                institution_id: { type: string }
                cycle_id: { type: string }
                subject_id: { type: string }
                level: { type: integer }
                exam_mode: { type: string, enum: [现场, 视频, 音基] }
                repertoire:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Draft registration created
  /registrations/{id}:
    get:
      summary: Get registration detail and status transition history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registration detail
  /registrations/{id}/status:
    patch:
      summary: Transition registration status (supports 1-click submitted -> locked, writes encrypted snapshot, triggers WeCom/WeChat MP notifications)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                from_status:
                  type: string
                  enum: [draft, submitted, needs_change, confirmed, locked]
                to_status:
                  type: string
                  enum: [draft, submitted, needs_change, confirmed, locked]
                teacher_notes:
                  type: string
      responses:
        "200":
          description: Registration status updated
        "409":
          description: Invalid status transition
  /archives:
    get:
      summary: List learner exam archive records
      responses:
        "200":
          description: Archive list
    post:
      summary: Save exam result/certificate record to learner archive
      responses:
        "201":
          description: Archive record created
  /exports:
    post:
      summary: Queue an export batch for locked registrations (generates Template v2.1 preview rows and portrait photo paths)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id, registration_ids]
              properties:
                cycle_id: { type: string }
                institution_id: { type: string }
                batch_type: { type: string, enum: [institution, super] }
                registration_ids:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Export job queued with download_csv_url, download_zip_url, and dedup summary
  /exports/dedup-preflight:
    post:
      summary: Preview SuperBatch deduplication and cross-institution/level conflicts before locking an export batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id, registration_ids]
              properties:
                cycle_id: { type: string }
                registration_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Dedup report (kept, auto_dropped, conflicts)
  /exports/{job_id}/csv:
    get:
      summary: Download Excel-compatible UTF-8 BOM CSV in strict Template v2.1 column order
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CSV attachment
  /exports/{job_id}/bundle.zip:
    get:
      summary: Download complete ZIP bundle (报名汇总表.csv + photos/{id_number}_{name_cn}.jpg + manifest.json)
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ZIP archive attachment
  /rpc/{action}:
    post:
      summary: Zero-rewrite RPC bridge for WeChat Mini Program (apps/wechat-mini)
      parameters:
        - in: path
          name: action
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RPC result ({ success, data })
  /webhooks/wechat-mp:
    get:
      summary: WeChat Service Account server URL verification (echostr)
      responses:
        "200":
          description: Verified echostr
    post:
      summary: WeChat Service Account inbound event/message webhook
      responses:
        "200":
          description: Literal "success"
  /webhooks/wechat-mp/menu-config:
    get:
      summary: Generate WeChat Service Account custom menu JSON mounting /app tabs
      responses:
        "200":
          description: Menu JSON payload
  /webhooks/wecom:
    get:
      summary: WeCom callback URL verification
      responses:
        "200":
          description: Verified echostr
    post:
      summary: WeCom inbound event webhook
      responses:
        "200":
          description: Literal "success"
  /notifications/wecom:
    post:
      summary: Dispatch markdown alert via wecom.xgar.com.cn relay
      responses:
        "200":
          description: Dispatch status
  /notifications/wechat-mp:
    post:
      summary: Build/send WeChat Service Account template message to parent
      responses:
        "200":
          description: Template payload and dispatch status
components:
  securitySchemes:
    familySessionHeader:
      type: apiKey
      in: header
      name: X-Mea-Session
      description: Expiring HMAC-signed family-admin session
    familySessionCookie:
      type: apiKey
      in: cookie
      name: mea_family_session
      description: Expiring HMAC-signed family-admin session
    teacherSessionHeader:
      type: apiKey
      in: header
      name: X-Mea-Teacher-Session
      description: Eight-hour HMAC-signed teacher session bound to the current invite
    teacherSessionCookie:
      type: apiKey
      in: cookie
      name: mea_teacher_session
      description: Eight-hour HttpOnly teacher cookie issued by resolve-session
    signedSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: HMAC
      description: A signed family-admin or teacher session; each retains its own role
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
