openapi: 3.0.3
info:
  title: Music Exam Aid - API & Service Account H5 Tool
  version: "2.3.0"
  description: OpenAPI specification for the MusicExamAid Fastify API, WeChat Service Account H5 Web Tool, WeCom notifications, ZIP bundle exporter, and Mini Program RPC bridge.
servers:
  - url: https://mea.xgar.com.cn
  - url: http://localhost:3000
paths:
  /official-sync/resolve-session:
    get:
      summary: Resolve the entry role and exchange a current teacher invite for a session
      description: >-
        A current random teacher invite (t_inv_<agent_id>_<32 hex characters>) issues an
        eight-hour HttpOnly, SameSite=Lax mea_teacher_session cookie, Secure in production.
        The signed token is not returned in JSON. Public demo or legacy invites may resolve
        the teacher landing page but return history_access=false and clear the teacher cookie.
        Parent referrals identify an entry channel, grant no historical lookup access, and
        clear the teacher cookie. Invalid invite/ref values also clear it. Resolving wx_openid
        without an invite requires verified family-admin credentials. With no invite/ref,
        strict verified family-admin authentication applies in every environment. Responses are not cacheable.
      parameters:
        - in: query
          name: invite_token
          schema: { type: string }
        - in: query
          name: ref
          schema: { type: string }
        - in: query
          name: wx_openid
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [parent, admin] }
      responses:
        "200":
          description: Resolved role and entry channel; teacher responses include history_access
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Set-Cookie:
              description: Issues or clears mea_teacher_session when an invite/ref is resolved
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [role, is_isolated, locked_agent]
                properties:
                  role: { type: string, enum: [teacher, parent, admin] }
                  is_isolated: { type: boolean }
                  history_access:
                    type: boolean
                    description: Whether this teacher invite can issue historical lookup credentials
                  locked_agent: { type: object, nullable: true }
        "401":
          description: Invalid invite/ref or missing family-admin credentials
  /official-sync/consolidate:
    post:
      summary: Consolidate official and helper registrations with admin-only PII access
      description: Requires a verified family-admin session in every environment before reading or creating learner, registration or payment records. Responses use Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      responses:
        "200": { description: Consolidation report and ingested registration IDs }
        "401": { description: Missing, expired or invalid family-admin session }
  /official-sync/media-proxy:
    get:
      summary: Proxy cached student media with an admin-only strict session
      description: Requires a verified family-admin session before media SQL or object-storage access. Responses use Cache-Control=no-store.
      security: &mediaFamilyAdminSecurity
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      responses:
        "200": { description: Student photo or video bytes }
        "206": { description: Requested media byte range }
        "400": { description: Missing source URL }
        "401": &mediaUnauthorized { description: Missing, expired or invalid family-admin session }
  /official-sync/media-cache-stats:
    get:
      summary: Read admin-only media cache and dataset mirror statistics
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Cache statistics and recent media metadata }
        "401": *mediaUnauthorized
  /official-sync/media-prebuffer:
    post:
      summary: Prebuffer admin-selected student media into local object storage
      description: Requires a verified family-admin session before reading historical exams or writing media. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Media prebuffer results }
        "401": *mediaUnauthorized
  /official-sync/stage-cert-or-photo:
    post:
      summary: Stage admin-only certificate, score screenshot or ID-photo metadata
      description: Requires a verified family-admin session before historical student lookup. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Staged media metadata and student matches }
        "401": *mediaUnauthorized
  /official-sync/execute-cert-or-photo:
    post:
      summary: Execute an admin-only certificate or photo upload
      description: Requires a verified family-admin session before database, storage or official-portal work. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Upload execution result }
        "400": { description: Invalid upload request }
        "401": *mediaUnauthorized
  /official-sync/video-chushen-check:
    post:
      summary: Run admin-only video initial-review checks
      description: Requires a verified family-admin session for both read-only checks and persisted updates. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Initial-review results }
        "401": *mediaUnauthorized
        "404": { description: No matching exam videos }
  /official-sync/video-chushen-apply:
    post:
      summary: Apply admin-only initial-review outcomes
      description: Requires a verified family-admin session before database or official-portal work. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Applied review outcomes }
        "400": { description: Missing review items }
        "401": *mediaUnauthorized
  /official-sync/video-ai-5d-review:
    post:
      summary: Run an admin-only AI 5D pre-exam review
      description: Requires a verified family-admin session before reading student history or videos. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Pre-exam assessment }
        "400": { description: Missing exam ID }
        "401": *mediaUnauthorized
        "404": { description: Exam not found }
  /official-sync/pull-remote:
    post:
      summary: Pull official-portal data through an admin-only strict session
      description: Requires a verified family-admin session before any official-portal request. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Remote pull results }
        "400": { description: Missing session or invalid table URL }
        "401": *mediaUnauthorized
  /official-sync/archive-stats:
    get:
      summary: Read admin-only historical archive statistics
      description: Requires a verified family-admin session before SQL access. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Archive statistics }
        "401": *mediaUnauthorized
  /official-sync/archive-upgrade-radar:
    get:
      summary: Read admin-only historical upgrade candidates
      description: Requires a verified family-admin session before reading student history. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Upgrade candidates and revenue estimates }
        "401": *mediaUnauthorized
  /official-sync/partner-agents:
    get:
      summary: List admin-only partner teacher and invite records
      description: Requires a verified family-admin session before SQL access. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Partner agent records }
        "401": *mediaUnauthorized
  /official-sync/studio-growth-intelligence:
    get:
      summary: Read admin-only studio growth intelligence
      description: Requires a verified family-admin session before reading teacher and student history. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Studio growth analysis }
        "401": *mediaUnauthorized
  /official-sync/teacher-fee-and-filing-report:
    get:
      summary: Read admin-only teacher fee and filing reports
      description: Requires a verified family-admin session before reading student or financial history. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Teacher fee and filing report }
        "401": *mediaUnauthorized
  /official-sync/mom-upload-log:
    get:
      summary: Read the admin-only certificate and photo upload log
      description: Requires a verified family-admin session before SQL access. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Upload log entries }
        "401": *mediaUnauthorized
  /official-sync/look-score-captcha:
    get:
      summary: Request an official score-query captcha through an admin-only route
      description: Requires a verified family-admin session before any official-portal request. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Captcha challenge }
        "401": *mediaUnauthorized
  /official-sync/look-score-query:
    post:
      summary: Query student scores through an admin-only strict session
      description: Requires a verified family-admin session before SQL or official-portal access. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Score query results }
        "400": { description: Missing student name }
        "401": *mediaUnauthorized
  /official-sync/yushen-model-status:
    get:
      summary: Read admin-only acoustic model status
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200": { description: Installed model status }
        "401": *mediaUnauthorized
        "503": { description: Model is not installed }
  /official-sync/student-lookup:
    get:
      summary: Search historical student profiles and exam records within the verified session scope
      description: >-
        Always requires verified credentials, including when ENFORCE_SERVER_AUTH=0 in development.
        Family admins can browse all profiles and full exam histories. Teachers can browse only
        profiles currently assigned to their signed agent ID and exams recorded under that agent ID.
        Counts, latest exams and recommendations use the same restricted history. Every teacher
        request rechecks the current invite digest; invite rotation/removal revokes the session.
        Parent referrals and client-supplied identities do not grant access. Responses use
        Cache-Control=no-store. Admin agent_id filters current profiles while retaining full history.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - teacherSessionHeader: []
        - teacherSessionCookie: []
        - signedSessionBearer: []
      parameters:
        - in: query
          name: q
          description: Name, pinyin, masked phone or masked ID search; empty lists authorized profiles
          schema: { type: string, maxLength: 200, default: "" }
        - in: query
          name: agent_id
          description: Optional admin filter; teachers may specify only their own agent ID
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: limit
          description: Positive safe integer; values above 50 are capped at 50
          schema: { type: integer, minimum: 1, maximum: 9007199254740991, default: 12 }
      responses:
        "200":
          description: Authorized profiles with scoped exam histories and upgrade recommendations
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [count, items]
                properties:
                  count: { type: integer }
                  items:
                    type: array
                    items: { type: object }
        "400":
          description: Invalid query, agent ID or limit
        "401":
          description: Missing, expired, invalid or revoked session
        "403":
          description: A teacher requested a different agent ID
  /app:
    get:
      summary: WeChat Service Account & WeCom H5 Web Tool (?tab=parent|archive|console)
      parameters:
        - in: query
          name: tab
          schema:
            type: string
            enum: [parent, archive, console]
      responses:
        "200":
          description: HTML application
  /health:
    get:
      summary: Service health and dependency status check (?live=1 for live TCP probe)
      parameters:
        - in: query
          name: live
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Service health status
  /learners:
    get:
      summary: List admin-only learner profiles with masked IDs (id_last4)
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: &domainFamilyAdminSecurity
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      responses:
        "200": { description: Learner list }
        "401": &domainUnauthorized { description: Missing, expired or invalid family-admin session }
    post:
      summary: Create an admin-only learner profile with AES-256-GCM encrypted ID at rest
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name_cn, gender, dob, id_type, id_number, guardian_phone]
              properties:
                name_cn: { type: string }
                gender: { type: string, enum: [男, 女] }
                dob: { type: string, format: date }
                id_type: { type: string }
                id_number: { type: string }
                guardian_phone: { type: string }
      responses:
        "201": { description: Learner created (returns id_last4 only) }
        "401": *domainUnauthorized
  /learners/{id}:
    get:
      summary: Get an admin-only learner profile (masked ID)
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Learner profile }
        "401": *domainUnauthorized
  /learners/{id}/photo:
    post:
      summary: Upload or replace an admin-only learner portrait photo (base64 JPEG/PNG) for ZIP bundle export
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo_base64]
              properties:
                photo_base64: { type: string }
      responses:
        "200": { description: Portrait photo stored }
        "401": *domainUnauthorized
  /registrations:
    get:
      summary: List admin-only registrations with resolved Chinese subject names
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      responses:
        "200": { description: Registration list }
        "401": *domainUnauthorized
    post:
      summary: Create an admin-only draft registration record for an exam cycle
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learner_id, cycle_id, subject_id, level]
              properties:
                learner_id: { type: string }
                institution_id: { type: string }
                cycle_id: { type: string }
                subject_id: { type: string }
                level: { type: integer }
                exam_mode: { type: string, enum: [现场, 视频, 音基] }
                repertoire:
                  type: array
                  items: { type: string }
      responses:
        "201": { description: Draft registration created }
        "401": *domainUnauthorized
  /registrations/{id}:
    get:
      summary: Get admin-only registration detail and status transition history
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Registration detail }
        "401": *domainUnauthorized
  /registrations/{id}/status:
    patch:
      summary: Transition an admin-only registration status (supports 1-click submitted -> locked, writes encrypted snapshot, triggers notifications)
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                from_status:
                  type: string
                  enum: [draft, submitted, needs_change, confirmed, locked]
                to_status:
                  type: string
                  enum: [draft, submitted, needs_change, confirmed, locked]
                teacher_notes:
                  type: string
      responses:
        "200": { description: Registration status updated }
        "401": *domainUnauthorized
        "409": { description: Invalid status transition }
  /archives:
    get:
      summary: List admin-only learner exam archive records
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      responses:
        "200": { description: Archive list }
        "401": *domainUnauthorized
    post:
      summary: Save an admin-only exam result/certificate record to learner archive
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      responses:
        "201": { description: Archive record created }
        "401": *domainUnauthorized
  /exports:
    post:
      summary: Queue an admin-only export batch for locked registrations (generates Template v2.1 preview rows and portrait photo paths)
      description: Requires a verified family-admin session in every environment. Teacher sessions and client-supplied owner IDs do not authorize exports. Responses use Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id, registration_ids]
              properties:
                cycle_id: { type: string }
                institution_id: { type: string }
                batch_type: { type: string, enum: [institution, super] }
                registration_ids:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Export job queued with download_csv_url, download_zip_url, and dedup summary
        "401":
          description: Missing, expired or invalid family-admin session
  /exports/dedup-preflight:
    post:
      summary: Preview admin-only SuperBatch deduplication and cross-institution/level conflicts before locking an export batch
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycle_id, registration_ids]
              properties:
                cycle_id: { type: string }
                registration_ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Dedup report (kept, auto_dropped, conflicts)
        "401":
          description: Missing, expired or invalid family-admin session
  /exports/{job_id}/csv:
    get:
      summary: Download admin-only Excel-compatible UTF-8 BOM CSV in strict Template v2.1 column order
      description: The CSV contains plaintext identity numbers. Requires a verified family-admin session in every environment and returns Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CSV attachment
        "401":
          description: Missing, expired or invalid family-admin session
  /exports/{job_id}/bundle.zip:
    get:
      summary: Download admin-only complete ZIP bundle (报名汇总表.csv + photos/{id_number}_{name_cn}.jpg + manifest.json)
      description: The bundle contains plaintext identity numbers and portrait photos. Requires a verified family-admin session in every environment and returns Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ZIP archive attachment
        "401":
          description: Missing, expired or invalid family-admin session
  /value-added/catalog:
    get:
      summary: List public value-added service catalog entries
      responses:
        "200": { description: Service catalog }
  /value-added/id-photo-polish:
    post:
      summary: Process an exam ID photo, with admin-only stored learner access
      description: Generic processing without learner_id is public. Supplying learner_id requires a verified family-admin session before reading or updating the learner. Learner-linked responses use Cache-Control=no-store.
      security:
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
        - {}
      responses:
        "200": { description: Photo compliance and polish result }
        "401": { description: learner_id was supplied without a verified family-admin session }
  /value-added/upgrade-radar:
    get:
      summary: Analyze admin-only learner registration and archive history
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      responses:
        "200": { description: Upgrade candidates and expected financial totals }
        "401": *domainUnauthorized
    post:
      summary: Analyze admin-only stored and supplied historical learner records
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *domainFamilyAdminSecurity
      responses:
        "200": { description: Upgrade candidates and expected financial totals }
        "401": *domainUnauthorized
  /concessions/rate-cards:
    get:
      summary: Read an admin-only per-teacher pricing and concession schedule
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: &familyAdminSecurity
        - familySessionHeader: []
        - familySessionCookie: []
        - signedSessionBearer: []
      parameters:
        - in: query
          name: teacher_id
          schema: { type: string }
      responses:
        "200": { description: Resolved grade rate schedule }
        "401": &financialUnauthorized { description: Missing, expired or invalid family-admin session }
    put:
      summary: Set an admin-only per-teacher, per-grade price and concession
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacher_id, level, exam_fee_fen, concession_fen]
              properties:
                teacher_id: { type: string }
                level: { type: string }
                exam_fee_fen: { type: integer, minimum: 0 }
                concession_fen: { type: integer, minimum: 0 }
                note: { type: string }
      responses:
        "200": { description: Updated rate card }
        "401": *financialUnauthorized
  /payments/checkout:
    post:
      summary: Create an admin-only exam checkout and concession record
      description: Requires a verified family-admin session in every environment. Parent checkout remains disabled until verified parent-to-registration ownership exists. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_id]
              properties:
                registration_id: { type: string }
                teacher_id: { type: string }
                addon_ids: { type: array, items: { type: string } }
                wx_transaction_id: { type: string }
      responses:
        "201": { description: Payment order and concession result }
        "401": *financialUnauthorized
  /concessions/wallet:
    get:
      summary: Read an admin-only teacher concession wallet, ledger and withdrawals
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      parameters:
        - in: query
          name: teacher_id
          schema: { type: string }
      responses:
        "200": { description: Teacher wallet and rate schedule }
        "401": *financialUnauthorized
  /concessions/{ledger_id}/confirm:
    patch:
      summary: Confirm or adjust an admin-only concession ledger entry
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      parameters:
        - in: path
          name: ledger_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Confirmed ledger entry }
        "401": *financialUnauthorized
  /concessions/withdrawals:
    post:
      summary: Create an admin-only teacher withdrawal request
      description: Requires a verified family-admin session in every environment. Teacher-initiated withdrawal remains disabled until a verified agent-to-teacher mapping exists. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teacher_id: { type: string }
                teacher_note: { type: string }
                payout_channel: { type: string, enum: [wechat_transfer, bank_transfer] }
      responses:
        "201": { description: Withdrawal request and included ledger items }
        "401": *financialUnauthorized
  /concessions/withdrawals/{id}/payout:
    patch:
      summary: Approve an admin-only withdrawal payout
      description: Requires a verified family-admin session in every environment. Responses use Cache-Control=no-store.
      security: *familyAdminSecurity
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Approved payout }
        "401": *financialUnauthorized
  /rpc/{action}:
    post:
      summary: Zero-rewrite RPC bridge for WeChat Mini Program (apps/wechat-mini)
      description: >-
        The bridge is default-deny. Only getDictSubjects, getDictCycles and institutionList are
        public. Every other action requires a verified family-admin session in every environment
        and returns Cache-Control=no-store. The 18 declared legacy actions without server
        implementations return 501 RPC_NOT_IMPLEMENTED, including authLogin; unknown actions return
        404 RPC_NOT_FOUND. Placeholder identities, roles and success results are never issued.
      parameters:
        - in: path
          name: action
          required: true
          schema: { type: string }
      responses:
        "200":
          description: RPC result ({ success, data })
        "401":
          description: A non-public action requires a verified family-admin session
        "404":
          description: Unknown RPC action (RPC_NOT_FOUND)
        "501":
          description: Declared legacy action has no server implementation (RPC_NOT_IMPLEMENTED)
  /parent/auth:
    post:
      summary: Exchange a Mini Program wx.login code for a verified parent session
      description: >-
        The server exchanges the one-time code with WeChat code2Session using
        WECHAT_MINI_APPID and WECHAT_MINI_SECRET. Parent identity comes only from the
        provider response. The two-hour parent token is returned as parent_token and in an
        HttpOnly, SameSite=Lax cookie (Secure in production). WeChat session_key and raw
        OpenID are not returned or persisted. Responses use Cache-Control=no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Parent token, role and two-hour lifetime; no learner access is implied
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            Set-Cookie: { schema: { type: string } }
        "400": { description: Missing or invalid wx.login code }
        "401": { description: WeChat rejected the code or returned no valid OpenID }
        "502": { description: WeChat exchange unavailable or malformed }
        "503": { description: Mini Program provider credentials are not configured }
  /parent/session:
    get:
      summary: List learner IDs explicitly granted to the authenticated parent
      description: >-
        Authentication alone grants no records. Only active, admin-managed grants are
        returned; revocation takes effect on the next request. No learner profile, OpenID
        or other parent's records are exposed. Responses use Cache-Control=no-store.
      security: &parentSessionSecurity
        - parentSessionHeader: []
        - parentSessionCookie: []
        - signedSessionBearer: []
      responses:
        "200":
          description: Parent role, token expiry and granted learner_ids
        "401": &parentUnauthorized
          description: Missing, expired or invalid parent session
  /parent/learners:
    get:
      summary: List public learner profiles covered by the parent's active grants
      description: >-
        Returns only explicitly granted learners. Encrypted ID numbers and ungranted
        records are never returned. Responses use Cache-Control=no-store.
      security: *parentSessionSecurity
      responses:
        "200": { description: Granted learner profiles with id_last4 but no encrypted ID number }
        "401": *parentUnauthorized
  /parent/learners/{learnerId}:
    get:
      summary: Read one learner profile through an active parent grant
      description: >-
        The grant is checked before repository access. Missing and cross-owner IDs both
        return 404 to avoid learner enumeration. Responses use Cache-Control=no-store.
      security: *parentSessionSecurity
      parameters:
        - in: path
          name: learnerId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Granted public learner profile }
        "401": *parentUnauthorized
        "404": { description: Learner missing or not granted to this parent }
    patch:
      summary: Edit profile and contact fields of an actively granted learner
      description: >-
        Requires a verified parent session and a current grant before repository access.
        Missing and cross-owner IDs return 404. Omitted fields are preserved; optional text
        fields can be cleared with an empty string. Document identifiers, photo state,
        record IDs, timestamps and storage flags are rejected. New learners still require
        administrator creation and a grant. Locked registration snapshots are unchanged.
        Uses the current in-memory domain repository; durable domain persistence remains
        a separate reliability milestone. Responses use Cache-Control=no-store and omit
        plaintext and encrypted document numbers.
      security: *parentSessionSecurity
      parameters:
        - in: path
          name: learnerId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name_cn: { type: string, minLength: 1, maxLength: 500 }
                name_en_optional: { type: string, maxLength: 500 }
                gender: { type: string, enum: [男, 女] }
                dob: { type: string, format: date, description: Valid calendar date in YYYY-MM-DD format }
                nationality: { type: string, minLength: 1, maxLength: 500 }
                ethnicity_optional: { type: string, maxLength: 500 }
                guardian_phone: { type: string, minLength: 1, maxLength: 500 }
                mailing_address_optional: { type: string, maxLength: 500 }
                recipient_name_optional: { type: string, maxLength: 500 }
                recipient_phone_optional: { type: string, maxLength: 500 }
      responses:
        "200": { description: Updated granted learner profile with document last four digits only }
        "400": { description: Empty patch, invalid profile values or protected fields }
        "401": *parentUnauthorized
        "404": { description: Learner missing or not granted to this parent }
  /parent/registrations:
    get:
      summary: List registrations whose learner is actively granted to the parent
      description: >-
        Registration records are filtered by current learner grants. Responses omit
        snapshot_json and internal status history and use Cache-Control=no-store.
      security: *parentSessionSecurity
      responses:
        "200": { description: Owned registrations with workflow status and learner name }
        "401": *parentUnauthorized
    post:
      summary: Create a draft registration for an actively granted learner
      description: >-
        The learner grant is checked before repository access. Client-supplied learner IDs
        without a grant return 404. Responses omit snapshot_json and use Cache-Control=no-store.
      security: *parentSessionSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learner_id, cycle_id, subject_id, level]
              properties:
                learner_id: { type: string }
                institution_id: { type: string }
                class_id: { type: string, description: Legacy alias for institution_id }
                cycle_id: { type: string }
                subject_id: { type: string }
                level: { type: integer, minimum: 1, maximum: 10 }
                exam_mode: { type: string, enum: [现场, 视频, 音基] }
                exam_site_id_optional: { type: string }
                repertoire: { type: array, items: { type: string } }
      responses:
        "201": { description: Created owned draft registration }
        "400": { description: Missing fields or a level outside 1..10 }
        "401": *parentUnauthorized
        "404": { description: Learner missing or not granted to this parent }
  /parent/registrations/{registrationId}:
    get:
      summary: Read one registration only when its learner is granted to the parent
      description: >-
        After parent authentication and grant lookup, the server resolves the registration's
        learner and verifies that learner before returning any fields. Missing and cross-owner
        IDs both return 404. Responses omit snapshot_json and internal status history and use
        Cache-Control=no-store.
      security: *parentSessionSecurity
      parameters:
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Owned public registration details }
        "401": *parentUnauthorized
        "404": { description: Registration missing or its learner is not granted }
    patch:
      summary: Edit an owned draft or returned registration without changing ownership or workflow
      description: >-
        Requires a verified parent session and a current grant for the registration's
        stored learner. Client-supplied ownership hints grant no access. Missing and
        cross-owner IDs return 404; submitted, confirmed and locked records return 409.
        Only subject, level, exam mode, site and repertoire can be changed. Learner, cycle,
        institution, teacher, status, notes, snapshot, timestamps and storage flags are
        rejected. Omitted details, locked snapshots and internal status history are
        preserved; an empty site or repertoire array clears that field. A different level
        is rejected with REGISTRATION_PRICE_LOCKED after any checkout order exists, since
        payment reconciliation is outside this edit flow. Responses omit
        snapshot_json and use Cache-Control=no-store. Uses the current in-memory domain
        repository pending the separate durable persistence milestone.
      security: *parentSessionSecurity
      parameters:
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                subject_id: { type: string, minLength: 1, maxLength: 128 }
                level: { type: integer, minimum: 1, maximum: 10 }
                exam_mode: { type: string, enum: [现场, 视频, 音基] }
                exam_site_id_optional: { type: string, maxLength: 128 }
                repertoire:
                  type: array
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Updated owned registration details with unchanged workflow status }
        "400": { description: Empty patch, protected fields or invalid detail values }
        "401": *parentUnauthorized
        "404": { description: Registration missing or its stored learner is not granted }
        "409": { description: Current status forbids edits or a checkout order prevents changing the level }
  /parent/registrations/{registrationId}/submit:
    post:
      summary: Submit an owned draft or needs-change registration
      description: >-
        The server verifies the registration's current learner grant before any mutation.
        Only valid transitions into submitted are accepted; cross-owner IDs return 404 and
        invalid states return 409. Responses omit snapshot_json and use Cache-Control=no-store.
      security: *parentSessionSecurity
      parameters:
        - in: path
          name: registrationId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated owned registration in submitted status }
        "401": *parentUnauthorized
        "404": { description: Registration missing or its learner is not granted }
        "409": { description: Current status cannot transition to submitted }
  /parent/learners/{learnerId}/grant:
    parameters:
      - in: path
        name: learnerId
        required: true
        schema: { type: string }
    put:
      summary: Grant or restore an explicit parent-to-learner ownership assertion
      description: >-
        Strict family-admin only. The referenced learner must exist. Referrals, supplied
        OpenIDs on parent requests, teacher IDs and the legacy default parent are not
        accepted as ownership evidence. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_openid]
              properties:
                parent_openid: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        "200": { description: Active grant for the provider-verified parent identity }
        "400": { description: Invalid parent OpenID }
        "401": *mediaUnauthorized
        "404": { description: Learner not found }
    delete:
      summary: Revoke a parent-to-learner grant immediately
      description: Strict family-admin only. Existing parent tokens remain valid but no longer list the revoked learner. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_openid]
              properties:
                parent_openid: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
      responses:
        "200": { description: Whether an active grant was revoked }
        "400": { description: Invalid parent OpenID }
        "401": *mediaUnauthorized
  /parent/learners/{learnerId}/grants:
    get:
      summary: List active and revoked grants for one learner
      description: Strict family-admin only; responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      parameters:
        - in: path
          name: learnerId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Grant audit rows for the learner }
        "401": *mediaUnauthorized
  /webhooks/wechat-mp:
    get:
      summary: WeChat Service Account server URL verification (echostr)
      responses:
        "200":
          description: Verified echostr
    post:
      summary: WeChat Service Account inbound event/message webhook with mandatory signature verification
      responses:
        "200":
          description: Literal "success"
        "403":
          description: Missing or invalid webhook signature
  /webhooks/wechat-mp/menu-config:
    get:
      summary: Generate WeChat Service Account custom menu JSON mounting /app tabs
      responses:
        "200":
          description: Menu JSON payload
  /webhooks/wecom:
    get:
      summary: WeCom callback URL verification
      responses:
        "200":
          description: Verified echostr
    post:
      summary: WeCom inbound event webhook with mandatory signature verification
      responses:
        "200":
          description: Literal "success"
        "403":
          description: Missing or invalid webhook signature
  /notifications/wecom:
    post:
      summary: Dispatch an admin-only markdown alert via wecom.xgar.com.cn relay
      description: Requires a verified family-admin session before validation or outbound dispatch. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200":
          description: Dispatch status
        "401": *mediaUnauthorized
  /notifications/wechat-mp:
    post:
      summary: Build/send an admin-only WeChat Service Account template message to a parent
      description: Requires a verified family-admin session before validation or dispatch. Responses use Cache-Control=no-store.
      security: *mediaFamilyAdminSecurity
      responses:
        "200":
          description: Template payload and dispatch status
        "401": *mediaUnauthorized
components:
  securitySchemes:
    familySessionHeader:
      type: apiKey
      in: header
      name: X-Mea-Session
      description: Expiring HMAC-signed family-admin session
    familySessionCookie:
      type: apiKey
      in: cookie
      name: mea_family_session
      description: Expiring HMAC-signed family-admin session
    parentSessionHeader:
      type: apiKey
      in: header
      name: X-Mea-Parent-Session
      description: Two-hour HMAC-signed parent session issued after server-side code2Session
    parentSessionCookie:
      type: apiKey
      in: cookie
      name: mea_parent_session
      description: Two-hour HttpOnly parent cookie issued by /parent/auth
    teacherSessionHeader:
      type: apiKey
      in: header
      name: X-Mea-Teacher-Session
      description: Eight-hour HMAC-signed teacher session bound to the current invite
    teacherSessionCookie:
      type: apiKey
      in: cookie
      name: mea_teacher_session
      description: Eight-hour HttpOnly teacher cookie issued by resolve-session
    signedSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: HMAC
      description: A signed family-admin, teacher or parent session; each retains its own role
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
