services:
  musicexamaid-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: musicexamaid-api
    restart: unless-stopped
    env_file:
      - ./.env.shared
    environment:
      PORT: "3100"
      ENABLE_LIVE_STORAGE: "1"
    ports:
      - "3100:3100"
    volumes:
      - ../services/api/data:/app/services/api/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health?live=1"]
      interval: 30s
      timeout: 5s
      retries: 3
